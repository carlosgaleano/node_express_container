services:
  api:
    build:
      context: ./app
      dockerfile: dockerfile

    container_name: api_express

    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - ./app/.env

    volumes:
      - ./app:/app
      - /app/node_modules

    networks:
      - laravel

networks:
  laravel:
    external: true